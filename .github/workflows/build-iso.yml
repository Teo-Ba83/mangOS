# Builds the MangOS ISOs and the mangos-system update package on GitHub's
# servers, signs the update with Sigstore (keyless, tied to this workflow),
# tests the updater against it, and publishes:
#   - the two ISOs (amd64, efi32) as a release of this repository: where
#     people download MangOS to make a USB stick;
#   - the update package as a release of the public updates repository
#     (MANGOS_UPDATES_REPO in scripts/versions.env), which installed MangOS
#     systems update themselves from.
#
# Publishing to the public repository needs the secret MANGOS_UPDATES_TOKEN
# (fine-grained token, "Contents: read and write" on that repository only).
# Without it the build is published as a release of this repository instead.
name: Build MangOS ISO

on:
  push:
    branches: [main, master, "ccr-*"]
    paths-ignore: ["docs/**", "**/*.md", "channels/**"]
  workflow_dispatch:
    inputs:
      require_artcraft:
        description: "Fail if the ArtCraft apps cannot be downloaded"
        type: boolean
        default: false

permissions:
  contents: write   # releases of this repository
  id-token: write   # Sigstore keyless signing

concurrency:
  group: build-iso
  cancel-in-progress: false

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      HAS_UPDATES_TOKEN: ${{ secrets.MANGOS_UPDATES_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Install debootstrap
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q debootstrap debian-archive-keyring

      - name: Build the ISO and the update package
        run: |
          set -o pipefail
          sudo env MANGOS_BUILDENV=/srv/mangos-buildenv \
            MANGOS_BUILD_ID=build.${{ github.run_number }} \
            MANGOS_REQUIRE_ARTCRAFT=${{ inputs.require_artcraft && '1' || '0' }} \
            scripts/buildenv.sh build --clean 2>&1 | tee build.log | grep --line-buffered -E '==>|^E: |^W: .*[Ll]ocal packages|ERROR|WARNING|ArtCraft|MangOS system|mangos-system|sha256|b43 firmware|wl for|craft'
          sudo chown -R "$(id -u):$(id -g)" out   # built as root; later steps run as the runner user
          ls -la out/
          for iso in out/MangOS-*.iso; do
            size=$(stat -c %s "$iso")
            echo "$(basename "$iso"): $size bytes"
            if [ "$size" -ge 2147483648 ]; then
              echo "::error::$iso is larger than 2 GiB, the limit for a GitHub release file"; exit 1
            fi
          done
          test -e out/MangOS-*-amd64.iso && test -e out/MangOS-*-efi32.iso

      - name: Show the end of the build log (on failure)
        if: failure()
        run: tail -80 build.log || true

      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.5.0

      - name: Sign the update package (Sigstore, keyless)
        run: |
          cosign sign-blob --yes --bundle out/mangos-system.deb.sigstore.json out/mangos-system.deb

      - name: Self-test the updater (signed accepted, tampered refused)
        run: |
          sudo mkdir -p /etc/mangos
          dpkg-deb --fsys-tarfile out/mangos-system.deb | tar -xO ./etc/mangos/updates.conf | sudo tee /etc/mangos/updates.conf
          UPD=config/includes.chroot/usr/lib/mangos/mangos-updater
          sudo env PATH="$PATH" MANGOS_UPDATES_URL_OVERRIDE="file://$PWD/out" MANGOS_UPDATER_DRY_RUN=1 sh "$UPD" install
          mkdir -p /tmp/tampered
          cp out/mangos-system.version out/mangos-system.deb.sigstore.json out/mangos-system.deb /tmp/tampered/
          printf 'x' >> /tmp/tampered/mangos-system.deb
          if sudo env PATH="$PATH" MANGOS_UPDATES_URL_OVERRIDE="file:///tmp/tampered" MANGOS_UPDATER_DRY_RUN=1 sh "$UPD" install; then
            echo "::error::The updater accepted a tampered package"; exit 1
          fi
          echo "Self-test passed: genuine update accepted, tampered update refused."

      - name: Prepare release notes
        id: meta
        run: |
          . scripts/versions.env
          echo "tag=v${MANGOS_VERSION}-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "updates_repo=${MANGOS_UPDATES_REPO}" >> "$GITHUB_OUTPUT"
          {
            echo "MangOS ${MANGOS_VERSION}, build #${{ github.run_number }} (system package \`$(cat out/mangos-system.version)\`)."
            echo
            echo "**New installation:** download the image for your Mac, check it against its \`.sha256\` file,"
            echo "write it to a USB stick (balenaEtcher works on Windows and macOS) and start the Mac holding Option."
            echo
            echo "- \`MangOS-${MANGOS_VERSION}-amd64.iso\`: Macs from late 2007 to 2012 (64-bit EFI)"
            echo "- \`MangOS-${MANGOS_VERSION}-efi32.iso\`: 2006-2007 Macs with 32-bit EFI (MacBook2,1, MacBook Pro 2,x,"
            echo "  iMac 5,x / 6,1, Mac mini 2,1, Mac Pro 1,1 / 2,1)."
            echo "  Which one for your Mac: https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/MAC-MODELS.md"
            echo "  The installed system and its updates are the same for both."
            echo
            echo "**Beta build.** Macs on the beta channel get it automatically; it reaches everyone (stable"
            echo "channel) when promoted. Updates are signed with Sigstore by the MangOS build workflow."
            echo "Settings > Software Update: channel, check now, go back to the previous version."
            echo
            echo '```'
            cat out/*.iso.sha256
            echo '```'
            echo
            echo "**ArtCraft apps installed in this ISO:**"
            echo '```'
            grep -E '^ArtCraft installed: ' build.log || echo "(none: ArtCraft is NOT in this ISO)"
            echo '```'
            echo
            echo "Tested on a MacBook (early 2008, MacBook4,1) and in virtual machines; other models: see the table above."
          } > release-notes.md
          cat release-notes.md
          {
            echo "MangOS system update \`$(cat out/mangos-system.version)\` (build #${{ github.run_number }}), signed with Sigstore"
            echo "by the MangOS build workflow. Installed MangOS systems download it by themselves"
            echo "(Settings > Software Update)."
            echo
            echo "**To install MangOS**, download the ISO from https://github.com/${{ github.repository }}/releases"
          } > updates-notes.md

      # Every build is a beta (pre-release). Builds reach the stable channel
      # (the release marked "latest") only when promoted with the
      # "Promote a build to stable" workflow.
      - name: Publish to the public updates repository (beta)
        if: env.HAS_UPDATES_TOKEN == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ steps.meta.outputs.updates_repo }}
          token: ${{ secrets.MANGOS_UPDATES_TOKEN }}
          tag_name: ${{ steps.meta.outputs.tag }}
          name: MangOS ${{ steps.meta.outputs.tag }} (beta)
          body_path: updates-notes.md
          prerelease: true
          make_latest: false
          files: |
            out/mangos-system.deb
            out/mangos-system.deb.sigstore.json
            out/mangos-system.version

      # The ISOs: a release of this (public) repository, a beta (pre-release)
      # until the build is promoted to stable.
      - name: Publish the ISOs (this repository)
        if: env.HAS_UPDATES_TOKEN == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: MangOS ${{ steps.meta.outputs.tag }} (beta)
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          prerelease: true
          make_latest: false
          files: |
            out/*.iso
            out/*.iso.sha256

      - name: Publish to this repository (no updates token configured)
        if: env.HAS_UPDATES_TOKEN != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: MangOS ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          prerelease: false
          make_latest: true
          files: |
            out/*.iso
            out/*.iso.sha256
            out/mangos-system.deb
            out/mangos-system.deb.sigstore.json
            out/mangos-system.version

      - name: Update the beta channel
        if: env.HAS_UPDATES_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.MANGOS_UPDATES_TOKEN }}
          REPO: ${{ steps.meta.outputs.updates_repo }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if ! gh release view beta -R "$REPO" >/dev/null 2>&1; then
            gh release create beta -R "$REPO" --prerelease --latest=false --title "MangOS beta channel" \
              --notes "Rolling beta channel used by MangOS updates (Settings > Software Update > beta)."
          fi
          gh release upload beta -R "$REPO" --clobber \
            out/mangos-system.deb out/mangos-system.deb.sigstore.json out/mangos-system.version
          gh release edit beta -R "$REPO" --prerelease --latest=false \
            --notes "Rolling beta channel used by MangOS updates. Current build: $TAG ($(cat out/mangos-system.version))."

      - name: Keep the stable build and the recent betas
        env:
          OWN_TOKEN: ${{ github.token }}
          UPDATES_TOKEN: ${{ secrets.MANGOS_UPDATES_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          UPDATES_REPO: ${{ steps.meta.outputs.updates_repo }}
        run: |
          if [ "$HAS_UPDATES_TOKEN" = true ]; then
            # keep: the beta channel, the stable build ("latest"), the 6 newest builds
            stable=$(GH_TOKEN="$UPDATES_TOKEN" gh release view -R "$UPDATES_REPO" --json tagName --jq .tagName 2>/dev/null || true)
            GH_TOKEN="$UPDATES_TOKEN" gh release list -R "$UPDATES_REPO" --limit 200 --json tagName,createdAt \
              --jq 'sort_by(.createdAt) | reverse | .[].tagName' |
            grep -vx beta | tail -n +7 | while read -r t; do
              [ "$t" = "$stable" ] && continue
              echo "Deleting old release $UPDATES_REPO $t"
              GH_TOKEN="$UPDATES_TOKEN" gh release delete "$t" -R "$UPDATES_REPO" --cleanup-tag --yes
            done
            # ISOs in this repository: keep the stable build and the 3 newest
            own_stable=$(GH_TOKEN="$OWN_TOKEN" gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
            GH_TOKEN="$OWN_TOKEN" gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
              --jq 'sort_by(.createdAt) | reverse | .[].tagName' |
            tail -n +4 | while read -r t; do
              [ "$t" = "$own_stable" ] && continue
              echo "Deleting old ISO release $t"
              GH_TOKEN="$OWN_TOKEN" gh release delete "$t" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done
          else
            GH_TOKEN="$OWN_TOKEN" gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' |
            while read -r t; do
              [ "$t" = "$TAG" ] && continue
              GH_TOKEN="$OWN_TOKEN" gh release delete "$t" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done
          fi

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14
