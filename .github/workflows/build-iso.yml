# Builds the MangOS ISO and the mangos-system update package on GitHub's
# servers, signs the update with Sigstore (keyless, tied to this workflow),
# tests the updater against it, and publishes ISO + update as the only
# release of the public updates repository (MANGOS_UPDATES_REPO in
# scripts/versions.env). Installed MangOS systems update themselves from it.
#
# Publishing to the public repository needs the secret MANGOS_UPDATES_TOKEN
# (fine-grained token, "Contents: read and write" on that repository only).
# Without it the build is published as a release of this repository instead.
name: Build MangOS ISO

on:
  push:
    branches: [main, master, "ccr-*"]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      require_artcraft:
        description: "Fail if the ArtCraft apps cannot be downloaded"
        type: boolean
        default: false

permissions:
  contents: write   # releases of this repository
  id-token: write   # Sigstore keyless signing

concurrency:
  group: build-iso
  cancel-in-progress: false

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      HAS_UPDATES_TOKEN: ${{ secrets.MANGOS_UPDATES_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Install debootstrap
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q debootstrap debian-archive-keyring

      - name: Build the ISO and the update package
        run: |
          set -o pipefail
          sudo env MANGOS_BUILDENV=/srv/mangos-buildenv \
            MANGOS_BUILD_ID=build.${{ github.run_number }} \
            MANGOS_REQUIRE_ARTCRAFT=${{ inputs.require_artcraft && '1' || '0' }} \
            scripts/buildenv.sh build --clean 2>&1 | tee build.log | grep --line-buffered -E '==>|^E: |^W: .*[Ll]ocal packages|ERROR|WARNING|ArtCraft|MangOS system|mangos-system|sha256|b43 firmware|wl for|craft'
          sudo chown -R "$(id -u):$(id -g)" out   # built as root; later steps run as the runner user
          ls -la out/
          size=$(stat -c %s out/MangOS-*.iso)
          echo "ISO size: $size bytes"
          if [ "$size" -ge 2147483648 ]; then
            echo "::error::The ISO is larger than 2 GiB, the limit for a GitHub release file"; exit 1
          fi

      - name: Show the end of the build log (on failure)
        if: failure()
        run: tail -80 build.log || true

      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.5.0

      - name: Sign the update package (Sigstore, keyless)
        run: |
          cosign sign-blob --yes --bundle out/mangos-system.deb.sigstore.json out/mangos-system.deb

      - name: Self-test the updater (signed accepted, tampered refused)
        run: |
          sudo mkdir -p /etc/mangos
          dpkg-deb --fsys-tarfile out/mangos-system.deb | tar -xO ./etc/mangos/updates.conf | sudo tee /etc/mangos/updates.conf
          UPD=config/includes.chroot/usr/lib/mangos/mangos-updater
          sudo env PATH="$PATH" MANGOS_UPDATES_URL_OVERRIDE="file://$PWD/out" MANGOS_UPDATER_DRY_RUN=1 sh "$UPD" install
          mkdir -p /tmp/tampered
          cp out/mangos-system.version out/mangos-system.deb.sigstore.json out/mangos-system.deb /tmp/tampered/
          printf 'x' >> /tmp/tampered/mangos-system.deb
          if sudo env PATH="$PATH" MANGOS_UPDATES_URL_OVERRIDE="file:///tmp/tampered" MANGOS_UPDATER_DRY_RUN=1 sh "$UPD" install; then
            echo "::error::The updater accepted a tampered package"; exit 1
          fi
          echo "Self-test passed: genuine update accepted, tampered update refused."

      - name: Prepare release notes
        id: meta
        run: |
          . scripts/versions.env
          echo "tag=v${MANGOS_VERSION}-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "updates_repo=${MANGOS_UPDATES_REPO}" >> "$GITHUB_OUTPUT"
          {
            echo "MangOS ${MANGOS_VERSION}, build #${{ github.run_number }} (system package \`$(cat out/mangos-system.version)\`)."
            echo
            echo "**New installation:** download \`MangOS-${MANGOS_VERSION}-amd64.iso\`, check it against the \`.sha256\` file,"
            echo "write it to a USB stick (balenaEtcher works on Windows and macOS) and start the Mac holding Option."
            echo
            echo "**Already installed:** MangOS updates itself from this release (files \`mangos-system.*\`,"
            echo "signed with Sigstore by the MangOS build workflow). Settings > Software Update checks right away."
            echo
            echo '```'
            cat out/*.iso.sha256
            echo '```'
            echo
            echo "**ArtCraft apps installed in this ISO:**"
            echo '```'
            grep -E '^ArtCraft installed: ' build.log || echo "(none: ArtCraft is NOT in this ISO)"
            echo '```'
            echo
            echo "Test build: tested in virtual machines only, not yet on a real MacBook."
          } > release-notes.md
          cat release-notes.md

      - name: Publish to the public updates repository
        if: env.HAS_UPDATES_TOKEN == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ steps.meta.outputs.updates_repo }}
          token: ${{ secrets.MANGOS_UPDATES_TOKEN }}
          tag_name: ${{ steps.meta.outputs.tag }}
          name: MangOS ${{ steps.meta.outputs.tag }}
          body_path: release-notes.md
          prerelease: false
          make_latest: true
          files: |
            out/*.iso
            out/*.iso.sha256
            out/mangos-system.deb
            out/mangos-system.deb.sigstore.json
            out/mangos-system.version

      - name: Publish to this repository (no updates token configured)
        if: env.HAS_UPDATES_TOKEN != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: MangOS ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          prerelease: false
          make_latest: true
          files: |
            out/*.iso
            out/*.iso.sha256
            out/mangos-system.deb
            out/mangos-system.deb.sigstore.json
            out/mangos-system.version

      - name: Keep only the latest build
        env:
          OWN_TOKEN: ${{ github.token }}
          UPDATES_TOKEN: ${{ secrets.MANGOS_UPDATES_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          UPDATES_REPO: ${{ steps.meta.outputs.updates_repo }}
        run: |
          prune() { # repo token tag-to-keep
            GH_TOKEN="$2" gh release list -R "$1" --limit 100 --json tagName --jq '.[].tagName' |
            while read -r t; do
              [ "$t" = "$3" ] && continue
              echo "Deleting old release $1 $t"
              GH_TOKEN="$2" gh release delete "$t" -R "$1" --cleanup-tag --yes
            done
          }
          if [ "$HAS_UPDATES_TOKEN" = true ]; then
            prune "$UPDATES_REPO" "$UPDATES_TOKEN" "$TAG"
            prune "$GITHUB_REPOSITORY" "$OWN_TOKEN" ""   # builds now live in the public repository
          else
            prune "$GITHUB_REPOSITORY" "$OWN_TOKEN" "$TAG"
          fi

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14
