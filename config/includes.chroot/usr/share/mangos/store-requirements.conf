# Mango Store labels for well-known apps.
#   <Debian package or Flathub id>  <light|medium|heavy|->  [needs...]
# needs: gl=X.Y (OpenGL version), vulkan, cpu=<flag>[+<flag>] (as in
# /proc/cpuinfo), ram=<GB>. "Not compatible with this Mac" is shown only
# when this machine does not meet a need, so newer Macs never see it.
# Apps not listed: Debian ones are judged from their size and what they
# are built on (Electron, Java, web engines); Flathub ones count as medium.
# Sources: each project's published system requirements.

# 3D, video, games that need modern graphics
blender                         heavy   gl=4.3     # Blender 4.x: OpenGL 4.3
org.blender.Blender             heavy   gl=4.3
org.upbge.UPBGE                 heavy   gl=4.3     # Blender-based
de.bforartists.Bforartists      heavy   gl=4.3     # Blender-based
obs-studio                      heavy   gl=3.3     # OBS Studio: OpenGL 3.3
com.obsproject.Studio           heavy   gl=3.3
org.godotengine.Godot           heavy   gl=3.3     # Godot 4: OpenGL 3.3 or Vulkan
org.godotengine.GodotSharp      heavy   gl=3.3
dolphin-emu                     heavy   gl=3.3
org.DolphinEmu.dolphin-emu      heavy   gl=3.3
net.pcsx2.PCSX2                 heavy   gl=3.3 cpu=sse4_1
net.rpcs3.RPCS3                 heavy   vulkan
org.upscayl.Upscayl             heavy   vulkan
com.jeffser.Alpaca              heavy   cpu=avx    # local AI models
io.gpt4all.gpt4all              heavy   cpu=avx
