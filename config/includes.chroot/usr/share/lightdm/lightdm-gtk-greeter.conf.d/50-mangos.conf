[greeter]
background=/usr/share/backgrounds/mangos/mangos-dark.png
user-background=false
theme-name=WhiteSur-Dark
icon-theme-name=WhiteSur-dark
cursor-theme-name=WhiteSur-cursors
font-name=Inter 11
xft-antialias=true
xft-hintstyle=hintslight
default-user-image=/usr/share/mangos/logo/mangos-logo-256.png
indicators=~host;~spacer;~clock;~spacer;~language;~layout;~a11y;~power
clock-format=%a %e %b  %H:%M
position=50%,center 50%,center
hide-user-image=false
round-user-image=true
