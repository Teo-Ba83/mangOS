# MacBook trackpad (appletouch / bcm5974) via libinput, Mac-like behaviour.
Section "InputClass"
    Identifier "MangOS touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "on"
    Option "TappingButtonMap" "lrm"
    Option "TappingDrag" "on"
    Option "NaturalScrolling" "true"
    Option "ScrollMethod" "twofinger"
    Option "ClickMethod" "clickfinger"
    Option "DisableWhileTyping" "on"
    Option "AccelSpeed" "0.25"
    # Two-finger scroll: the default (15) scrolled about five lines for a
    # tiny movement on the MacBook3,1 trackpad; 50 tested right on the Mac.
    Option "ScrollPixelDistance" "50"
EndSection

Section "InputClass"
    Identifier "MangOS mouse natural scroll"
    MatchIsPointer "on"
    MatchIsTouchpad "off"
    Driver "libinput"
    Option "NaturalScrolling" "false"
EndSection
