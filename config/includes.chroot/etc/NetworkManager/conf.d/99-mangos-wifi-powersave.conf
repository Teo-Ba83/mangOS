# MangOS: Wi-Fi power saving off. With the Broadcom wl driver it can make the
# connection stop working while it still looks connected.
[connection]
wifi.powersave = 2

# Random MAC addresses while scanning confuse the wl driver: the first
# connection works, reconnecting later hangs. Scan with the real address.
[device]
wifi.scan-rand-mac-address = no
