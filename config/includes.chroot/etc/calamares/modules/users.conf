---
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
    - input
autologinGroup:  autologin
doAutologin:     false
sudoersGroup:    sudo
setRootPassword: false
doReusePassword: true
user:
    shell: /bin/bash
    forbidden_names: [ root, mangos-live ]
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "mangos"
    forbidden_names: [ localhost ]
passwordRequirements:
    nonempty: true
    minLength: -1
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: true
