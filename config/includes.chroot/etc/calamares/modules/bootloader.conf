# GRUB for BIOS, 64-bit EFI and 32-bit EFI (2006-2008 Intel Macs). The EFI
# target is picked from /sys/firmware/efi/fw_platform_size by Calamares;
# mangos-bootloader-config installs the matching grub package beforehand.
---
efiBootLoader: "grub"
kernel: "/vmlinuz"
img: "/initrd.img"
timeout: "3"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
efiBootloaderId: "mangos"
installEFIFallback: true
