# MangOS: make the Command key behave like on a Mac.
# Cmd+C/V/X/Z/A/S/W/T/F/N... -> Ctrl+... (works in every app)
# Cmd+Tab -> switch apps, Cmd+Space -> Launchpad/search, Cmd+Q -> quit window,
# Cmd+H / Cmd+M -> hide (minimise). The physical Ctrl key stays Ctrl.
[ids]
*

[main]
leftmeta = layer(meta_mac)
rightmeta = layer(meta_mac)

[meta_mac:C]
tab = swapm(app_switch_state, A-tab)
space = M-space
q = A-f4
h = A-f9
m = A-f9

[app_switch_state:A]
tab = A-tab
